# Render Blueprint: Dashboard → New → Blueprint → pick this repo.
# Creates the Express API (web service) and the Vite client (static site).
# If Render had to add a suffix to either URL, update VITE_API_URL / CORS_ORIGIN to match.
services:
  - type: web
    name: aura-is401-api
    runtime: node
    plan: free
    region: virginia # same region as the Supabase project (us-east-1)
    branch: main
    autoDeploy: true # every push/merge to main redeploys
    buildCommand: npm ci --workspace server --include-workspace-root
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # paste the Session pooler URI in the dashboard; never commit it
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # profile photo uploads: Project Settings > API Keys > service_role; secret, never commit it
      - key: CORS_ORIGIN
        value: https://aura-is401.onrender.com
      - key: SUPABASE_URL # public: the API checks sign-ins against this project's published keys
        value: https://rcyafwgjnnlgnakwkksi.supabase.co
      - key: NODE_VERSION
        value: "22"

  - type: web
    name: aura-is401
    runtime: static
    branch: main
    autoDeploy: true
    buildCommand: npm ci --workspace client --include-workspace-root && npm run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://aura-is401-api.onrender.com
      # Supabase Auth for sign up / sign in. Both are public by design (row-level security
      # blocks the app tables from this key), and the same values are in client/.env.development.
      - key: VITE_SUPABASE_URL
        value: https://rcyafwgjnnlgnakwkksi.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_Cgiby1pYgm1olb5Na1s-HQ_wzyVQAiC
      - key: NODE_VERSION
        value: "22"
